[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-plugin-framework"
version = "0.1.0"
description = "Safety-first plugin contracts for quantitative strategy research"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
runtime = ["numpy>=2.0", "pandas>=2.3", "moomoo==10.12.7208"]
test = ["pytest>=8", "numpy>=2.0", "pandas>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "plugins"]
testpaths = ["tests"]
